name: Build LineageOS 20.0 (X6532C)

# ROM build for the Infinix Smart 9 HD (X6532C, MT6765).
#
# The sources live in the rom-dev repos under the ryu4nn account:
#   device/infinix/X6532C  <- ryu4nn/android_device_infinix_X6532C (lineage-20.0)
#   vendor/infinix/X6532C  <- ryu4nn/android_vendor_infinix_X6532C (main)
# They are pulled in through a local manifest written at run time, so this
# repository only has to carry the workflow.
#
# Android 13 versus the Android 12 vendor partition, in one place:
#   * The vendor is VNDK 31; the platform is VNDK 33. The device tree sets
#     PRODUCT_EXTRA_VNDK_VERSIONS := 31 so the v31 snapshot libraries and
#     ld.config.31.txt ship from prebuilts/vndk/v31.
#   * The generic ramdisk stays in boot.img (no init_boot), matching the stock
#     layout where init_boot_a.img is 8 MiB of zeroes.
#   * vendor_boot is built but never flashed: TWRP lives there.
#   * VINTF enforcement is disabled for this bring-up run; see device.mk.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Soong goal (droid = all images without OTA, bacon, otapackage)"
        required: false
        default: "droid"
      sync_only:
        description: "Only sync the tree, skip the build"
        type: boolean
        required: false
        default: false
      artifact_super:
        description: "Also ship super.img (5 GiB raw, ~1.2 GiB zstd) for a whole-super flash"
        type: boolean
        required: false
        default: false
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVICE: X6532C
  LINEAGE_BRANCH: lineage-20.0
  DEVICE_TREE_REPO: ryu4nn/android_device_infinix_X6532C
  DEVICE_TREE_REV: lineage-20.0
  VENDOR_REPO: ryu4nn/android_vendor_infinix_X6532C
  VENDOR_REV: main
  BUILD_DIR: /home/runner/lineage

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Checkout this workflow repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # The stock GitHub runner has ~65 GB free. A LineageOS checkout plus
      # out/ plus the 483 MB GApps payload needs almost all of it, so the
      # preinstalled toolchains and SDKs that this build never touches are
      # removed first.
      # ------------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /usr/share/swift \
            /usr/local/.ghcup \
            /var/lib/docker \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/lib/mono \
            /usr/local/share/chromium \
            /usr/share/gradle
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "after:"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            zstd openjdk-11-jdk \
            libncurses5 libtinfo5
          # The RenderScript prebuilt is LLVM 3.8 (prebuilts/clang/host/linux-x86/
          # clang-3289846) and still links against libncurses.so.5/libtinfo.so.5,
          # which Ubuntu 22.04 no longer ships by default.
          java -version

      - name: Set up git and the repo tool
        run: |
          git config --global user.name  "rynekoo"
          git config --global user.email "rynekoo@users.noreply.github.com"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          ~/bin/repo --version

      - name: repo init
        run: |
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          repo init --depth=1 -u https://github.com/LineageOS/android.git -b "$LINEAGE_BRANCH"

      - name: Write the device + vendor local manifest
        run: |
          mkdir -p "$BUILD_DIR/.repo/local_manifests"
          cat > "$BUILD_DIR/.repo/local_manifests/X6532C.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="ryu4nn/android_device_infinix_X6532C"
                     path="device/infinix/X6532C"
                     remote="github"
                     revision="lineage-20.0" />
            <project name="ryu4nn/android_vendor_infinix_X6532C"
                     path="vendor/infinix/X6532C"
                     remote="github"
                     revision="main" />
          </manifest>
          XML
          cat "$BUILD_DIR/.repo/local_manifests/X6532C.xml"

      - name: repo sync
        run: |
          cd "$BUILD_DIR"
          repo sync -c --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc)
          echo "--- disk after sync ---"
          df -h /
          du -sh "$BUILD_DIR" 2>/dev/null || true
          echo "--- device tree present? ---"
          ls -la device/infinix/X6532C/BoardConfig.mk vendor/infinix/X6532C/X6532C-vendor.mk

      # ------------------------------------------------------------------
      # Google apps.
      #
      # Nothing proprietary is committed. tools/fetch-gapps.sh downloads the
      # pinned MindTheGapps 13.0.0 arm archive (227 MB), checks its sha256 and
      # writes gapps/gapps.mk with one PRODUCT_COPY_FILES line per payload
      # file. device.mk inherits that makefile only when it exists, so a build
      # without this step still produces vanilla LineageOS.
      #
      # The arm archive is the right one: this device is armeabi-v7a only and
      # ro.vendor.product.cpu.abilist64 is empty, so arm64 libraries would
      # never be loaded.
      #
      # MindTheGapps 13 keeps its payload under system/product and
      # system/system_ext, which are separate logical partitions here, so the
      # script maps the three top-level directories to the three image roots.
      # 467 MB lands in product.img and 16 MB in system_ext.img, which is why
      # the disk trims below exist.
      # ------------------------------------------------------------------
      - name: Fetch Google apps
        run: |
          cd "$BUILD_DIR/device/infinix/X6532C"
          ./tools/fetch-gapps.sh
          echo "--- gapps.mk ---"
          head -8 gapps/gapps.mk
          grep -c '^PRODUCT_COPY_FILES' gapps/gapps.mk
          echo "--- disk after gapps ---"
          df -h /

      # ------------------------------------------------------------------
      # A depth=1 LineageOS 19.1 checkout stores each project twice: the
      # working tree and a bare mirror under .repo, ~23 GB in total. The
      # build only reads the working tree, with one exception: the rule
      # that writes build-manifest.xml runs
      #
      #   python3 .repo/repo/repo manifest -o - -r
      #
      # and `-r` resolves each project's HEAD out of .repo/projects and
      # .repo/project-objects, so the mirrors cannot simply be deleted.
      # Instead the manifest is produced while the metadata is intact,
      # the mirrors are dropped, and `repo` is replaced with a stub that
      # replays the recorded manifest. It takes no other arguments and
      # nothing else in the tree calls repo (vendor/lineage/config/
      # version.mk is date based and never invokes git).
      # ------------------------------------------------------------------
      - name: Trim .repo and record the manifest
        run: |
          cd "$BUILD_DIR"
          echo "--- .repo before ---"
          du -sh .repo 2>/dev/null || true
          python3 .repo/repo/repo manifest -o - -r > "$GITHUB_WORKSPACE/build-manifest.xml"
          grep -c "<project " "$GITHUB_WORKSPACE/build-manifest.xml"
          rm -rf .repo/projects .repo/project-objects .repo/manifests.git
          printf 'import sys\nsys.stdout.write(open("%s").read())\n' \
            "$GITHUB_WORKSPACE/build-manifest.xml" > .repo/repo/repo
          echo "--- stub replays manifest? ---"
          python3 .repo/repo/repo manifest -o - -r | grep -c "<project "
          echo "--- .repo after ---"
          du -sh .repo 2>/dev/null || true
          df -h /

      # ------------------------------------------------------------------
      # out/ needs ~50 GB, the GApps payload adds 483 MB to the checkout and
      # ~483 MB more to the images, and this runner has ~54 GB left after the
      # checkout. Two trims are safe:
      #
      #  * prebuilts/qemu-kernel is an emulator kernel referenced from
      #    board makefiles, not from any Android.bp.
      #  * prebuilts/clang/host/linux-x86 carries every toolchain revision
      #    AOSP supports. A device build uses exactly two: the platform
      #    compiler (cc/config/global.go: ClangDefaultVersion) and the
      #    RenderScript one (RSClangVersion). Only those two are kept.
      #
      # prebuilts/vndk/v31 stays: PRODUCT_EXTRA_VNDK_VERSIONS := 31 installs
      # its snapshot libraries, and Soong globs the sibling version
      # directories at parse time, so pruning them is not free.
      #
      # cts/ and test/ must stay even though they are not built: they
      # define VtsHalDriverDefaults, vts_proto_fuzzer_default and
      # cts_support_defaults, which Android.bp files elsewhere reference.
      # ------------------------------------------------------------------
      - name: Reclaim space for out/
        run: |
          cd "$BUILD_DIR"
          echo "--- top level sizes ---"
          du -sh --exclude=.repo * 2>/dev/null | sort -h | tail -20
          echo "--- prebuilts sizes ---"
          du -sh prebuilts/* 2>/dev/null | sort -h | tail -15

          rm -rf prebuilts/qemu-kernel

          # The remote execution client only matters for USE_RBE and the
          # emulator prebuilts only feed the emulator images; neither is
          # reachable from `droid`, and `m nothing` below fails loudly if a
          # blueprint still points into them. prebuilts/gradle-plugin and
          # prebuilts/abi-dumps are NOT touched: their Android.bp files define
          # modules other trees depend on (metalava-gradle-plugin-deps,
          # vndk_abi_dump_zip), and soong resolves those at parse time.
          for d in remoteexecution-client android-emulator; do
            if [ -d "prebuilts/$d" ]; then
              du -sh "prebuilts/$d"
              rm -rf "prebuilts/$d"
            fi
          done

          CLANG_DIR=prebuilts/clang/host/linux-x86
          echo "--- clang revisions present ---"
          du -sh "$CLANG_DIR"/clang-* 2>/dev/null | sort -h

          # The keep list is derived from build/soong instead of hard coded.
          # Three separate constants pick a revision: ClangDefaultVersion and
          # RSClangVersion in cc/config/global.go, and bindgenClangVersion in
          # rust/bindgen.go. Dropping one breaks the build far from where it
          # is declared - clang-r416183b1 and clang-r416183b differ by a digit
          # and a missing libclang surfaces as a bindgen panic late in the run.
          REFERENCED=$(grep -rhoE 'clang-(r[0-9a-z]+|[0-9]{6,})' build/soong 2>/dev/null | sort -u)
          echo "--- revisions referenced by build/soong ---"
          echo "$REFERENCED" | tr '\n' ' '; echo
          if [ -z "$REFERENCED" ]; then
            echo "nothing derived from build/soong; keeping every toolchain"
          else
            for d in "$CLANG_DIR"/*; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              case "$name" in clang-*) ;; *) continue ;; esac
              if echo "$REFERENCED" | grep -qx -- "$name"; then
                echo "keeping $name"
              else
                echo "dropping $name"
                rm -rf "$d"
              fi
            done
          fi

          echo "--- after ---"
          df -h /
          du -sh "$BUILD_DIR" 2>/dev/null || true

      # Lineage rewrites both device_kernel_headers and qti_kernel_headers to
      # generated_kernel_headers (build/soong/cc/cc.go, rewriteHeaderLibs),
      # and that module's rule runs `make headers_install` inside
      # $(TARGET_KERNEL_SOURCE). This device ships a prebuilt GKI kernel and
      # has no kernel source tree, so both names are pointed at the AOSP
      # device_kernel_headers placeholder instead. bionic's libc already
      # exports kernel/uapi to every module that links libc, which covers
      # what these modules include (sound/asound.h, linux/types.h, asm/*).
      - name: Keep AOSP kernel headers for the prebuilt kernel
        run: |
          cd "$BUILD_DIR"
          sed -i \
            -e 's|// Replace device_kernel_headers with generated_kernel_headers|// Point both names at the AOSP device_kernel_headers placeholder|' \
            -e 's|// for inline kernel building|// (prebuilt kernel: no source tree for headers_install)|' \
            -e 's|newHeaderLibs = append(newHeaderLibs, "generated_kernel_headers")|newHeaderLibs = append(newHeaderLibs, "device_kernel_headers")|' \
            build/soong/cc/cc.go
          grep -q 'newHeaderLibs = append(newHeaderLibs, "device_kernel_headers")' build/soong/cc/cc.go
          if grep -q '"generated_kernel_headers"' build/soong/cc/cc.go; then
            echo "generated_kernel_headers is still referenced"; exit 1
          fi
          sed -n '/rewriteHeaderLibs := func/,/^		}/p' build/soong/cc/cc.go

      # The stock MTK/Transsion init scripts use keywords and syntax that the
      # AOSP init parser rejects (tran_factory_reset, load_system_props,
      # $prop floating expansion, //STD comments). host_init_verifier parses
      # every copied .rc file near the end of the build and failed at 89% in
      # run #21. This device keeps the stock vendor partition and never flashes
      # the vendor image, so the vendor copies skip the verifier and keep the
      # plain copy rule. System init scripts are still verified as before.
      - name: Skip init verification for the stock vendor scripts
        run: |
          cd "$BUILD_DIR"
          if ! grep -q 'vendor/infinix/X6532C/%,$(1)' build/make/core/definitions.mk; then
            sed -i '/^define copy-init-script-file-checked$/a\
          # Stock MTK/Transsion init scripts use builtins and syntax this init rejects.\n# The stock vendor partition is never flashed, so these copies skip host_init_verifier.\nifneq ($(filter vendor/infinix/X6532C/%,$(1)),)\n$(2): $(1)' build/make/core/definitions.mk
            sed -i '0,/^ifdef TARGET_BUILD_UNBUNDLED$/s//else ifdef TARGET_BUILD_UNBUNDLED/' build/make/core/definitions.mk
          fi
          grep -q 'vendor/infinix/X6532C/%,$(1)' build/make/core/definitions.mk
          grep -q 'else ifdef TARGET_BUILD_UNBUNDLED' build/make/core/definitions.mk
          sed -n '/^define copy-init-script-file-checked/,+6p' build/make/core/definitions.mk

      # sepolicy_tests (and the treble_sepolicy_tests that share the same
      # all_fc_files) checks that every type used in a file_contexts file is
      # defined by the policy this tree builds. The vendor file_contexts of
      # this device comes from the stock vendor partition, installed by
      # X6532C-vendor.mk, and the types it labels - aee_core_data_file,
      # sysfs_OTG_CTL_file, the Transsion/MTK *_exec domains - are declared by
      # the stock vendor policy, which is prebuilt in vendor/etc/selinux and is
      # never built here. Feeding that file to the check can only fail; run #25
      # stopped on 369 such types across /data, /sys, /vendor and /system.
      # Drop the vendor file_contexts from all_fc_files: the platform,
      # system_ext and product checks, which do describe this tree, still run.
      - name: Skip the vendor file_contexts check
        run: |
          cd "$BUILD_DIR"
          sed -i '/^all_fc_files += \$(TARGET_OUT_VENDOR)\/etc\/selinux\/vendor_file_contexts$/d' system/sepolicy/Android.mk
          if grep -q 'all_fc_files += \$(TARGET_OUT_VENDOR)/etc/selinux/vendor_file_contexts' system/sepolicy/Android.mk; then
            echo "the vendor file_contexts is still in all_fc_files"; exit 1
          fi
          sed -n '/^all_fc_files := /,/^all_fc_args :=/p' system/sepolicy/Android.mk

      # Parsing the whole module graph costs a minute and proves the trims
      # above did not remove anything a blueprint refers to. The second
      # command exercises the repo stub through the real build rule, which
      # is the one thing `m nothing` cannot cover.
      - name: Validate module graph
        run: |
          cd "$BUILD_DIR"
          source build/envsetup.sh
          lunch lineage_X6532C-userdebug
          m nothing
          # libtinycompress is the only module here that asks for kernel
          # headers, so building it proves the patch below is sufficient.
          m libtinycompress
          # bindgen resolves libclang through LIBCLANG_PATH and panicked at
          # 62% of run #20 when clang-r416183b had been pruned, so build it
          # here rather than discovering it three quarters of the way in.
          m libbinder_ndk_bindgen
          m "out/target/product/$DEVICE/obj/ETC/build-manifest_intermediates/build-manifest.xml"
          wc -c "out/target/product/$DEVICE/obj/ETC/build-manifest_intermediates/build-manifest.xml"

      # droid is the AOSP default goal (DEFAULT_GOAL := droid in
      # core/main.mk). It builds droidcore-unbundled: system, system_ext,
      # vendor, product, boot, vendor_boot, vbmeta*, userdata and
      # super_empty.img, plus dtbo.img transitively through vbmeta.img.
      # It does not build target_files or the payload OTA, which would
      # duplicate every image on disk (~15 GB) and spend 20-30 min
      # compressing them into a zip the stock recovery rejects anyway.
      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_only != true }}
        run: |
          cd "$BUILD_DIR"
          source build/envsetup.sh
          lunch lineage_X6532C-userdebug
          # No AOT compilation of the boot classpath. It removes a few GB of
          # odex/vdex intermediates and is the supported way to cut both disk
          # and build time; first boot runs the JIT instead, which is fine
          # for a bring-up build.
          export WITH_DEXPREOPT=false
          ( while true; do
              echo "--- $(date -u +%FT%TZ) ---"
              df -h / | tail -1
              du -sh out 2>/dev/null
              sleep 600
            done ) > "$GITHUB_WORKSPACE/disk-monitor.log" 2>&1 &
          mka ${TARGET:-droid} -j$(nproc)
        env:
          TARGET: ${{ github.event.inputs.target || 'droid' }}

      # ------------------------------------------------------------------
      # Artifacts, compressed.
      #
      # Raw ext4 images are large and mostly zeroes. The flash set is packed
      # into one deflated archive (-9) instead of being uploaded as loose
      # 1.2 GB files, which keeps the artifact around 0.8-0.9 GB instead of
      # 2.5 GB. Nothing is duplicated: super.img would contain system,
      # system_ext, product and vendor a second time, so it only ships when
      # explicitly requested and then as zstd.
      #
      # vendor.img and vendor_boot.img are never in the flash set. The vendor
      # partition is the fixed Android 12 reference this ROM is built against,
      # and TWRP lives in vendor_boot; docs/FLASHING.md explains the rest.
      # ------------------------------------------------------------------
      - name: Collect artifacts
        if: always()
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          OUT="$BUILD_DIR/out/target/product/$DEVICE"
          A="$GITHUB_WORKSPACE/artifacts"
          echo "--- $OUT ---"
          ls -la "$OUT" 2>/dev/null

          FLASH="boot dtbo vbmeta vbmeta_system vbmeta_vendor system system_ext product super_empty"
          mkdir -p "$A/flash"
          for i in $FLASH; do
            if [ -f "$OUT/$i.img" ]; then
              cp "$OUT/$i.img" "$A/flash/"
              echo "flash set: $i.img $(du -h "$OUT/$i.img" | cut -f1)"
            fi
          done

          if [ -d "$A/flash" ] && [ -n "$(ls -A "$A/flash")" ]; then
            ZIP="$A/lineage-20.0-X6532C-${GITHUB_RUN_NUMBER}-images.zip"
            echo "--- compressing flash set ---"
            ( cd "$A/flash" && zip -9 -q "$ZIP" ./* )
            ( cd "$A/flash" && sha256sum ./* ) > "$A/SHA256SUMS"
            rm -rf "$A/flash"
            ls -la "$ZIP"
            cat "$A/SHA256SUMS"
          else
            echo "no images produced; nothing to package"
          fi

          if [ -f "$OUT/super.img" ] && [ "${{ inputs.artifact_super }}" = "true" ]; then
            echo "--- compressing super.img ---"
            zstd -T0 -12 -q -f -o "$A/super.img.zst" "$OUT/super.img"
            sha256sum "$A/super.img.zst" >> "$A/SHA256SUMS"
          fi

          [ -f "$GITHUB_WORKSPACE/disk-monitor.log" ] && \
            cp "$GITHUB_WORKSPACE/disk-monitor.log" "$A/" || true
          echo "--- disk after build ---"
          df -h /
          echo "--- collected ---"
          ls -la "$A"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-20.0-X6532C-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: /home/runner/lineage/out/verbose.log.gz
          if-no-files-found: ignore
          retention-days: 7
